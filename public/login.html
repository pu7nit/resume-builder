<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="dark" />
    <title>Sign in — Resume Forge</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="login-body">
    <main class="login-card">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">▤</span>
        <span class="brand-text">resume<em>forge</em></span>
      </div>
      <h1>Private instance</h1>
      <p>This resume builder is password protected. Enter the password you set in <code>APP_PASSWORD</code>.</p>
      <form id="login-form" autocomplete="off">
        <label class="field">
          <span>Password</span>
          <input type="password" id="password" name="password" required autofocus />
        </label>
        <button class="btn primary" type="submit" id="login-submit">Unlock</button>
        <p class="login-error" id="login-error" hidden></p>
      </form>
    </main>
    <script src="/login.js" type="module"></script>
  </body>
</html>
